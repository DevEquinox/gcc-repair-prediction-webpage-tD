version: "3.8"

services:
  backend:
    build: ./backend
    container_name: gcc-backend
    volumes:
      - ./model:/model
      - ../Equipo-D/data/raw:/Equipo-D/data/raw:ro
    expose:
      - "8000"

  frontend:
    build: ./frontend
    container_name: gcc-frontend
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: gcc-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
